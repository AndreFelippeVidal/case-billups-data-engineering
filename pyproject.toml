[project]
name = "case-billups-data-engineering"
version = "0.1.0"
description = "A local PySpark Medallion analysis for the Billups challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "pyspark==3.5.6",
    "streamlit==1.43.2",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
