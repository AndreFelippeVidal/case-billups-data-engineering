[project]
name = "case-billups-data-engineering"
version = "0.1.0"
description = "A local PySpark Medallion analysis for the Billups challenge"
requires-python = ">=3.12,<3.13"
dependencies = ["pyspark==3.5.6"]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
